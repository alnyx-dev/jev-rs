name: Release

# Publishes a GitHub Release for a version tag. Source-only: GitHub attaches
# the automatic source archives (zip/tar.gz) to the release, and users build
# locally with `cargo build --release`.
#
# The tag can be pushed manually (`git tag v0.x.y && git push`) or created
# automatically by autotag.yml when the Cargo.toml version changes on main.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.2.1)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release (source archives)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Jev-RS ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          body: |
            **Source-only release** — no prebuilt binaries are attached.
            GitHub provides the source archives (`Source code (zip)` / `(tar.gz)`).

            Build and run locally:

            ```bash
            # 1. Export the model once (Python)
            pip install optimum[onnxruntime] transformers torch
            python scripts/setup_model.py

            # 2. Build (Windows: DirectML GPU by default; other platforms: CPU)
            cargo build --release
            # Linux/macOS CPU build:
            # cargo build --release --no-default-features

            # 3. Run
            ./target/release/jev-rs
            ```

            The server looks for `model_onnx/` in the working directory and next
            to the executable; override with `JEV_MODEL_PATH` / `JEV_TOKENIZER_PATH`.
          files: []
