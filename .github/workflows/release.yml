name: Release

# Build release binaries and publish a GitHub Release when a version tag
# (v*) is pushed manually, or when invoked via workflow_call by autotag.yml
# (GitHub does not run workflows for tags created with the caller's own
# GITHUB_TOKEN, hence the reusable-entry path).

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.2.0)"
        type: string
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.os }} ${{ matrix.note }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # DirectML (GPU) build for Windows — default features.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            note: DirectML
          # CPU-only builds for every other platform.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: --no-default-features
            note: CPU
          - os: macos-latest
            target: aarch64-apple-darwin
            features: --no-default-features
            note: CPU
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (--release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/jev-rs.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "jev-rs-${env:RELEASE_TAG}-x86_64-windows"
          Compress-Archive -Path $bin -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "dist/$name.sha256"

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/jev-rs"
          TRIPLE="${{ matrix.target }}"
          if [[ "$TRIPLE" == *aarch64* ]]; then ARCH="aarch64"; else ARCH="$(echo "$TRIPLE" | cut -d- -f1)"; fi
          if [[ "$TRIPLE" == *windows* ]]; then OS="windows"; else OS="$(echo "$TRIPLE" | cut -d- -f3)"; fi
          NAME="jev-rs-${RELEASE_TAG}-${ARCH}-${OS}"
          mkdir -p dist
          tar czf "dist/${NAME}.tar.gz" -C "$(dirname "$BIN")" jev-rs
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Jev-RS ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/*
