name: Release

# Build release binaries and publish a GitHub Release when a version tag
# (v*) is pushed — either manually (`git tag v0.x.y && git push`) or
# automatically by autotag.yml when the Cargo.toml version changes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }} ${{ matrix.note }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # DirectML (GPU) build for Windows — default features.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: ""
            note: DirectML
          # CPU-only builds for every other platform.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: --no-default-features
            note: CPU
          - os: macos-latest
            target: aarch64-apple-darwin
            features: --no-default-features
            note: CPU
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build (--release, locked)
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/jev-rs.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "jev-rs-$env:GITHUB_REF_NAME-x86_64-windows"
          Copy-Item README.md, LICENSE -Destination dist -ErrorAction SilentlyContinue
          Compress-Archive -Path $bin -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline "dist/$name.zips"
          Rename-Item "dist/$name.zips" "$name.sha256"
          Remove-Item dist/README.md, dist/LICENSE -ErrorAction SilentlyContinue

      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/jev-rs"
          TRIPLE="${{ matrix.target }}"
          if [[ "$TRIPLE" == *aarch64* ]]; then ARCH="aarch64"; else ARCH="$(echo "$TRIPLE" | cut -d- -f1)"; fi
          OS="$(echo "$TRIPLE" | cut -d- -f3)"
          NAME="jev-rs-${GITHUB_REF_NAME}-${ARCH}-${OS}"
          mkdir -p dist
          tar czf "dist/${NAME}.tar.gz" -C "$(dirname "$BIN")" jev-rs
          ( cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256" )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Jev-RS ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
