name: Release

# Publishes a GitHub Release for a version tag.
#
# Assets:
#   * jev-rs-windows-x86_64.zip — prebuilt Windows binary (DirectML) + docs
#   * source archives (zip/tar.gz) — attached by GitHub automatically
#
# The tag can be pushed manually (`git tag v0.x.y && git push`) or created
# automatically by autotag.yml when the Cargo.toml version changes on main.

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.3.0)"
        type: string
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  ASSET_NAME: jev-rs-windows-x86_64.zip

jobs:
  build:
    name: build (windows-x86_64 DirectML)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - name: Build (--release, locked)
        run: cargo build --release --locked
        env:
          CXXFLAGS: /MD
          CFLAGS: /MD

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item "target/release/jev-rs.exe" dist/stage/
          Copy-Item README.md, LICENSE, scripts/setup_model.py dist/stage/
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/${{ env.ASSET_NAME }}"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/${{ env.ASSET_NAME }}").Hash.ToLower()
          "$hash  ${{ env.ASSET_NAME }}" | Set-Content -NoNewline "dist/${{ env.ASSET_NAME }}.sha256"
          Remove-Item "dist/stage" -Recurse -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          retention-days: 7

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Jev-RS ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          body: |
            **Windows users:** download `jev-rs-windows-x86_64.zip` — the portable
            build of the engine (DirectML). Extract it, place the `model_onnx`
            folder next to `jev-rs.exe` (or point `JEV_MODEL_PATH` /
            `JEV_TOKENIZER_PATH` at an existing model) and run the binary.

            **Build from source:**

            ```bash
            cargo build --release                  # Windows: DirectML GPU
            # cargo build --release --no-default-features   # Linux/macOS: CPU
            ./target/release/jev-rs --download-model         # fetch the model (~2.3 GB)
            ./target/release/jev-rs
            ```

            The engine downloads a pre-exported ONNX bundle from the Hugging Face
            Hub — no Python and no virtualenv required. The server looks for
            `model_onnx/` in the working directory and next to the executable;
            override with `JEV_MODEL_PATH` / `JEV_TOKENIZER_PATH`.
          files: dist/*
